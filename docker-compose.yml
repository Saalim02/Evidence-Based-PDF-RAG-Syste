services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: rag_backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs

    restart: unless-stopped


  frontend:

    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: rag_frontend

    ports:
      - "8501:8501"

    depends_on:
      - backend

    env_file:
      - .env

    environment:
      - FASTAPI_BASE_URL=http://backend:8000/api

    restart: unless-stopped